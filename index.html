<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EMO Eyes</title>
<style>
  /* ===== Base / fullscreen robot screen ===== */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 6vw;
  }

  /* ===== Eye housing (dark rounded square) ===== */
  .eye {
    position: relative;
    width: min(30vmin, 240px);
    height: min(34vmin, 270px);
    background: radial-gradient(circle at 50% 45%, #10151a 0%, #07090c 60%, #030405 100%);
    border-radius: 45%;
    border: 2px solid #14202a;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,.9),
      0 0 25px rgba(0, 255, 240, .07),
      0 0 60px rgba(0, 255, 240, .04);
    overflow: hidden;
    transition: border-radius .25s ease;
  }

  /* Glowing pupil */
  .pupil {
    position: absolute;
    left: 50%; top: 50%;
    width: 58%; height: 58%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%,
      #b8fff4 0%, #4dfbe4 25%, #0fd8c8 55%, #067f7a 85%, #033a3a 100%);
    box-shadow:
      0 0 18px rgba(0,255,235,.85),
      0 0 45px rgba(0,255,235,.45),
      0 0 90px rgba(0,255,235,.2),
      inset 0 0 20px rgba(255,255,255,.25);
    transition: width .18s ease, height .18s ease, border-radius .2s ease, opacity .2s ease;
    will-change: transform;
  }
  /* specular highlight */
  .pupil::after {
    content: "";
    position: absolute;
    left: 22%; top: 16%;
    width: 26%; height: 20%;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    filter: blur(3px);
  }

  /* Eyelid (closes from top) */
  .lid {
    position: absolute;
    left: -5%; top: -5%;
    width: 110%; height: 0;
    background: #05070a;
    border-radius: 0 0 50% 50% / 0 0 30% 30%;
    z-index: 5;
    transition: height .12s ease;
    box-shadow: 0 4px 12px rgba(0,0,0,.8);
  }
  .eye.blink .lid { height: 105%; }

  /* ===== Scanlines + vignette overlay ===== */
  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 1px,
      transparent 1px, transparent 4px);
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 51;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
  }
  /* subtle screen flicker */
  #flicker {
    position: fixed; inset: 0; pointer-events: none; z-index: 52;
    background: rgba(0,255,235,.02);
    animation: flick 6s infinite;
  }
  @keyframes flick {
    0%,100% { opacity: .3; } 48% { opacity: .3; } 50% { opacity: 1; } 52% { opacity: .3; }
  }

  /* ===== UI hints (Persian, RTL) ===== */
  #hints {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    direction: rtl;
    z-index: 60;
    color: rgba(120, 230, 220, .55);
    font-family: Tahoma, "Segoe UI", sans-serif;
    font-size: clamp(12px, 2vmin, 16px);
    letter-spacing: .5px;
    pointer-events: none;
  }
  #hints span { margin: 0 10px; }

  /* Mood label */
  #mood {
    position: fixed;
    top: 24px; left: 0; right: 0;
    text-align: center;
    direction: rtl;
    z-index: 60;
    color: #6ffbe9;
    font-family: Tahoma, "Segoe UI", sans-serif;
    font-size: clamp(18px, 4vmin, 32px);
    text-shadow: 0 0 14px rgba(0,255,235,.8), 0 0 40px rgba(0,255,235,.35);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  #mood.show { opacity: 1; }
  #camera-controls {
    position: fixed; top: 12px; right: 12px; z-index: 65;
    max-width: min(280px, 65vw); color: #92cfc8;
    font: 12px/1.8 Tahoma, sans-serif;
  }
  #camera-toggle {
    border: 1px solid #28766e; border-radius: 12px;
    padding: 9px 14px; background: #071d1b; color: #8ffff0;
    font: inherit; cursor: pointer; touch-action: manipulation;
  }
  #camera-toggle:focus-visible { outline: 2px solid #8ffff0; outline-offset: 3px; }
  #camera-status { margin: 6px 0; }
  #camera-preview {
    display: none; width: 120px; border-radius: 10px;
    transform: scaleX(-1); border: 1px solid #28766e;
  }
  #camera-preview.active { display: block; }
  /* Expressive light silhouettes, with tracking outside the animated SVG group. */
  #stage { direction: ltr; }
  .eye { border-color: #0b1c22; border-radius: 38%; }
  .pupil {
    width: 100%; height: 100%; border-radius: 0;
    background: none; box-shadow: none;
    color: #59ffe5;
    transition: color .3s ease;
  }
  .pupil::after { display: none; }
  .pupil svg { width: 100%; height: 100%; overflow: visible; }
  .expression-art {
    transform-origin: 50px 50px;
    filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 9px currentColor);
  }
  .expression { fill: currentColor; stroke: currentColor; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .tear { display: none; fill: #6cbfff; }
  [data-mood="normal"] .expression-art { animation: attentive 4s ease-in-out infinite; }
  [data-mood="happy"] .expression { fill: none; stroke-width: 10; }
  [data-mood="happy"] .expression-art { animation: delighted 1.8s ease-in-out infinite; }
  [data-mood="sad"] .pupil { color: #73baff; }
  [data-mood="sad"] .tear { display: block; animation: teardrop 3.2s ease-in infinite; }
  [data-mood="sad"] #eyeR .tear { animation-delay: 1.6s; }
  [data-mood="angry"] .pupil { color: #ff8066; }
  [data-mood="angry"] .expression-art { animation: tense 2.2s ease-in-out infinite; }
  [data-mood="surprised"] .pupil { color: #a5fff5; }
  [data-mood="surprised"] .expression { fill: #062c30; stroke-width: 9; }
  [data-mood="surprised"] .expression-art { animation: startled .45s ease-out; }
  [data-mood="sleepy"] .pupil { color: #829ce6; opacity: .65; }
  [data-mood="sleepy"] .expression { fill: none; stroke-width: 7; }
  [data-mood="sleepy"] .expression-art { animation: dozing 4s ease-in-out infinite; }
  .blush, .thought-dots { display: none; }
  [data-mood="love"] .pupil { color: #ff79b7; }
  [data-mood="love"] .expression-art { animation: heartbeat 1.5s ease-in-out infinite; }
  [data-mood="suspicious"] .pupil { color: #d4f68a; }
  [data-mood="suspicious"] #eyeL .expression-art { animation: skeptical 3.5s ease-in-out infinite; }
  [data-mood="dizzy"] .pupil { color: #bd9bff; }
  [data-mood="dizzy"] .expression { fill: none; stroke-width: 6; }
  [data-mood="dizzy"] .expression-art { animation: spiral 5s linear infinite; }
  [data-mood="dizzy"] #eyeR .expression-art { animation-direction: reverse; }
  [data-mood="cheeky"] .pupil { color: #69fbd2; }
  [data-mood="cheeky"] .expression { fill: none; stroke-width: 9; }
  [data-mood="cheeky"] #eyeR .expression-art { animation: teasing 2.6s ease-in-out infinite; }
  [data-mood="bored"] .pupil { color: #91b6be; opacity: .75; }
  [data-mood="bored"] .expression { fill: none; stroke-width: 8; }
  [data-mood="excited"] .pupil { color: #ffe67e; }
  [data-mood="excited"] .expression-art { animation: star-bounce 1.1s ease-in-out infinite; }
  [data-mood="excited"] #eyeR .expression-art { animation-delay: .12s; }
  [data-mood="shy"] .pupil { color: #ffb5d2; }
  [data-mood="shy"] .blush { display: block; stroke: #ff73a2; stroke-width: 4; stroke-linecap: round; animation: blushing 3s ease-in-out infinite; }
  [data-mood="thinking"] .pupil { color: #97d9ff; }
  [data-mood="thinking"] #eyeR .thought-dots { display: block; fill: currentColor; }
  .thought-dots circle { animation: pondering 1.5s ease-in-out infinite; }
  .thought-dots circle:nth-child(2) { animation-delay: .2s; }
  .thought-dots circle:nth-child(3) { animation-delay: .4s; }
  @keyframes heartbeat { 0%, 45%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(1.03); } }
  @keyframes skeptical { 50% { transform: translateY(-3px) rotate(-4deg); } }
  @keyframes spiral { to { transform: rotate(360deg); } }
  @keyframes teasing { 0%, 70%, 100% { transform: scaleY(1); } 80%, 90% { transform: scaleY(.15); } }
  @keyframes star-bounce { 50% { transform: translateY(-4px) rotate(5deg) scale(1.04); } }
  @keyframes blushing { 50% { opacity: .4; } }
  @keyframes pondering { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  @keyframes attentive { 50% { transform: scaleY(.96); } }
  @keyframes delighted { 0%, 65%, 100% { transform: translateY(0); } 25% { transform: translateY(-4px); } 40% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes teardrop { 0%, 30% { opacity: 0; transform: translateY(-3px) scaleY(.7); } 45% { opacity: .9; } 90%, 100% { opacity: 0; transform: translateY(9px); } }
  @keyframes tense { 50% { transform: scaleY(.9); } }
  @keyframes startled { 0% { transform: scale(.65); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes dozing { 50% { transform: translateY(3px) scaleY(.65); opacity: .55; } }
  #mood-picker {
    position: fixed; bottom: 54px; left: 12px; right: 12px; z-index: 65;
    display: flex; flex-wrap: nowrap; justify-content: flex-start; gap: 6px;
    width: max-content; max-width: calc(100% - 24px); margin: 0 auto;
    overflow-x: auto; padding: 5px 0 10px; touch-action: pan-x;
  }
  #mood-picker button {
    font: 12px Tahoma, sans-serif; color: #80b7b1; background: #071513;
    border: 1px solid #193c37; border-radius: 20px; padding: 9px 13px;
    cursor: pointer; touch-action: pan-x; flex-shrink: 0;
  }
  #mood-picker button[aria-pressed="true"] { color: #b4fff1; border-color: #60dbc7; background: #10312a; }
  #mood-picker button:focus-visible { outline: 2px solid #8ffff0; outline-offset: 3px; }
  @media (max-width: 600px) { #mood { top: auto; bottom: 140px; font-size: 18px; } #hints { font-size: 10px; } #hints span { margin: 0 3px; } }
  @media (prefers-reduced-motion: reduce) { .expression-art, .tear, .blush, .thought-dots circle, #flicker { animation: none !important; } }
</style>
</head>
<body>
  <div id="stage" data-mood="normal">
    <div class="eye" id="eyeL"><div class="pupil"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="expression-art"><path class="expression"/><path class="tear" d="M79 71 Q68 87 79 89 Q90 87 79 71Z"/></g><g class="blush"><path d="M20 76 L18 82 M28 76 L26 82 M36 76 L34 82"/></g><g class="thought-dots"><circle cx="37" cy="80" r="3"/><circle cx="50" cy="80" r="3"/><circle cx="63" cy="80" r="3"/></g></svg></div><div class="lid"></div></div>
    <div class="eye" id="eyeR"><div class="pupil"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="expression-art"><path class="expression"/><path class="tear" d="M79 71 Q68 87 79 89 Q90 87 79 71Z"/></g><g class="blush"><path d="M20 76 L18 82 M28 76 L26 82 M36 76 L34 82"/></g><g class="thought-dots"><circle cx="37" cy="80" r="3"/><circle cx="50" cy="80" r="3"/><circle cx="63" cy="80" r="3"/></g></svg></div><div class="lid"></div></div>
  </div>
  <div id="overlay"></div>
  <div id="vignette"></div>
  <div id="flicker"></div>
  <div id="mood"></div>
  <div id="camera-controls">
    <button id="camera-toggle" type="button" aria-pressed="false">روشن کردن دوربین</button>
    <p id="camera-status" role="status">واکنش به حرکت • پردازش فقط روی دستگاه شما</p>
    <video id="camera-preview" autoplay muted playsinline aria-label="پیش‌نمایش آینه‌ای دوربین"></video>
  </div>
  <div id="mood-picker" role="group" aria-label="انتخاب حالت چشم‌ها">
    <button type="button" data-select-mood="normal">عادی</button>
    <button type="button" data-select-mood="happy">خوشحال</button>
    <button type="button" data-select-mood="sad">ناراحت</button>
    <button type="button" data-select-mood="angry">عصبانی</button>
    <button type="button" data-select-mood="surprised">متعجب</button>
    <button type="button" data-select-mood="sleepy">خواب‌آلود</button>
    <button type="button" data-select-mood="love">عاشق</button>
    <button type="button" data-select-mood="suspicious">مشکوک</button>
    <button type="button" data-select-mood="dizzy">گیج</button>
    <button type="button" data-select-mood="cheeky">شیطون</button>
    <button type="button" data-select-mood="bored">بی‌حوصله</button>
    <button type="button" data-select-mood="excited">هیجان‌زده</button>
    <button type="button" data-select-mood="shy">خجالتی</button>
    <button type="button" data-select-mood="thinking">در حال فکر</button>
  </div>
  <div id="hints"><span>کلیک/لمس = تغییر حالت</span><span>•</span><span>حرکت = دنبال کردن</span></div>

<script>
(function () {
  "use strict";
  /* ================= State ================= */
  var eyes = [document.getElementById("eyeL"), document.getElementById("eyeR")];
  var pupils = eyes.map(function (e) { return e.querySelector(".pupil"); });
  var moodEl = document.getElementById("mood");

  var mouse = { x: innerWidth / 2, y: innerHeight / 3 };
  var cur = { x: 0, y: 0 };          // current pupil offset (px)
  var mood = "normal";
  var moodTimer = null;

  var MOODS = ["normal", "happy", "sad", "angry", "surprised", "sleepy", "love", "suspicious", "dizzy", "cheeky", "bored", "excited", "shy", "thinking"];
  var MOOD_FA = {
    normal: "عادی", happy: "خوشحال", sad: "غمگین",
    angry: "عصبانی", surprised: "متعجب", sleepy: "خواب‌آلود", love: "عاشق", suspicious: "مشکوک", dizzy: "گیج", cheeky: "شیطون", bored: "بی‌حوصله", excited: "هیجان‌زده", shy: "خجالتی", thinking: "در حال فکر"
  };

  /* ================= Pointer tracking ================= */
  var lastPointer = 0;
  function setPointer(x, y) { mouse.x = x; mouse.y = y; lastPointer = performance.now(); }
  addEventListener("mousemove", function (e) { setPointer(e.clientX, e.clientY); });
  addEventListener("touchmove", function (e) {
    if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  /* Compare small grayscale frames; no images leave this page. */
  var cameraButton = document.getElementById("camera-toggle");
  var cameraStatus = document.getElementById("camera-status");
  var video = document.getElementById("camera-preview");
  var canvas = document.createElement("canvas");
  canvas.width = 80; canvas.height = 60;
  var context = canvas.getContext("2d", { willReadFrequently: true });
  var stream = null, cameraRequest = 0, cameraTimer = null, previousFrame = null;
  var cameraTarget = { x: .5, y: .5, time: -Infinity };

  function stopCamera(message) {
    cameraRequest++;
    clearInterval(cameraTimer);
    cameraTimer = null;
    if (stream) stream.getTracks().forEach(function (track) { track.stop(); });
    stream = null;
    video.srcObject = null;
    video.classList.remove("active");
    previousFrame = null;
    cameraTarget.time = -Infinity;
    cameraButton.textContent = "روشن کردن دوربین";
    cameraButton.setAttribute("aria-pressed", "false");
    cameraStatus.textContent = message || "دوربین خاموش است";
  }

  function readMotion() {
    if (video.readyState < 2) return;
    context.drawImage(video, 0, 0, 80, 60);
    var pixels = context.getImageData(0, 0, 80, 60).data;
    var frame = new Float32Array(4800), meanChange = 0;
    for (var i = 0; i < frame.length; i++) {
      frame[i] = pixels[i * 4] * .299 + pixels[i * 4 + 1] * .587 + pixels[i * 4 + 2] * .114;
      if (previousFrame) meanChange += frame[i] - previousFrame[i];
    }
    if (previousFrame) {
      meanChange /= frame.length;
      var weight = 0, x = 0, y = 0, changed = 0;
      for (var j = 0; j < frame.length; j++) {
        // Ignore sensor noise and uniform exposure changes.
        var delta = Math.abs(frame[j] - previousFrame[j] - meanChange);
        if (delta < 22) continue;
        changed++;
        weight += delta;
        x += (j % 80) * delta;
        y += Math.floor(j / 80) * delta;
      }
      if (changed > 24 && changed < frame.length * .65) {
        cameraTarget.x = 1 - x / weight / 79;
        cameraTarget.y = y / weight / 59;
        cameraTarget.time = performance.now();
      }
    }
    previousFrame = frame;
  }

  cameraButton.addEventListener("click", async function () {
    if (stream || cameraTimer === "pending") { stopCamera(); return; }
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraStatus.textContent = "برای استفاده از دوربین، صفحه را با HTTPS یا localhost باز کنید.";
      return;
    }
    var request = ++cameraRequest;
    cameraTimer = "pending";
    cameraButton.textContent = "لغو درخواست دوربین";
    cameraStatus.textContent = "در انتظار اجازهٔ دسترسی به دوربین…";
    try {
      var acquired = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } }
      });
      if (request !== cameraRequest) {
        acquired.getTracks().forEach(function (track) { track.stop(); });
        return;
      }
      stream = acquired;
      stream.getVideoTracks()[0].addEventListener("ended", function () {
        if (request === cameraRequest) stopCamera("اتصال دوربین قطع شد؛ دوباره روشن کنید.");
      });
      video.srcObject = stream;
      await video.play();
      if (request !== cameraRequest) return;
      video.classList.add("active");
      cameraButton.textContent = "خاموش کردن دوربین";
      cameraButton.setAttribute("aria-pressed", "true");
      cameraStatus.textContent = "دوربین روشن است؛ دستتان را حرکت دهید تا چشم‌ها دنبال کنند.";
      cameraTimer = setInterval(readMotion, 80);
    } catch (error) {
      if (request !== cameraRequest) return;
      var messages = {
        NotAllowedError: "اجازهٔ دوربین داده نشد؛ دسترسی را در تنظیمات مرورگر فعال کنید.",
        NotFoundError: "دوربینی پیدا نشد؛ اتصال دوربین را بررسی کنید.",
        NotReadableError: "دوربین در دسترس نیست؛ برنامه‌های دیگرِ استفاده‌کننده را ببندید."
      };
      stopCamera(messages[error.name] || "راه‌اندازی دوربین ناموفق بود؛ دوباره تلاش کنید.");
    }
  });
  addEventListener("pagehide", function () { stopCamera(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopCamera("دوربین با خروج از صفحه خاموش شد؛ برای ادامه دوباره روشن کنید.");
  });

  /* ================= Mood handling ================= */
  function showMood() {
    moodEl.textContent = MOOD_FA[mood];
    moodEl.classList.add("show");
    clearTimeout(moodTimer);
    moodTimer = setTimeout(function () { moodEl.classList.remove("show"); }, 1400);
  }

  function cycleMood() {
    var i = MOODS.indexOf(mood);
    mood = MOODS[(i + 1) % MOODS.length];
    applyMood();
    showMood();
  }

  // Shapes use physical left/right coordinates, independent of the page's RTL text.
  var EXPRESSIONS = {
    normal: ['M32 28 Q50 22 68 28 Q76 50 68 72 Q50 78 32 72 Q24 50 32 28', 'M32 28 Q50 22 68 28 Q76 50 68 72 Q50 78 32 72 Q24 50 32 28'],
    happy: ['M20 61 L50 31 L80 61', 'M20 61 L50 31 L80 61'],
    sad: ['M20 53 Q50 48 80 30 L78 62 Q52 79 25 65 Z', 'M20 30 Q50 48 80 53 L75 65 Q48 79 22 62 Z'],
    angry: ['M18 32 L82 52 L77 68 Q47 80 24 62 Z', 'M18 52 L82 32 L76 62 Q53 80 23 68 Z'],
    surprised: ['M50 17 A25 33 0 1 1 49.9 17 Z', 'M50 17 A25 33 0 1 1 49.9 17 Z'],
    sleepy: ['M21 58 Q50 66 79 58', 'M21 58 Q50 66 79 58'],
    love: ["M50 78 C40 69 16 52 19 35 C22 17 43 18 50 33 C57 18 78 17 81 35 C84 52 60 69 50 78Z","M50 78 C40 69 16 52 19 35 C22 17 43 18 50 33 C57 18 78 17 81 35 C84 52 60 69 50 78Z"],
    suspicious: ["M20 52 L78 45 L76 61 Q50 69 23 60Z","M32 28 Q50 22 68 28 Q76 50 68 72 Q50 78 32 72 Q24 50 32 28"],
    dizzy: ["M50 50 C40 37 29 53 41 64 C60 80 82 55 67 34 C45 7 11 35 23 63 C35 90 82 85 85 50","M50 50 C40 37 29 53 41 64 C60 80 82 55 67 34 C45 7 11 35 23 63 C35 90 82 85 85 50"],
    cheeky: ["M20 61 L50 31 L80 61","M22 50 Q50 59 78 50"],
    bored: ["M22 55 L78 55","M22 55 L78 55"],
    excited: ["M50 17 L60 38 L83 41 L66 57 L70 81 L50 69 L30 81 L34 57 L17 41 L40 38Z","M50 17 L60 38 L83 41 L66 57 L70 81 L50 69 L30 81 L34 57 L17 41 L40 38Z"],
    shy: ["M34 45 Q42 37 50 45 L50 61 Q42 69 34 61Z","M50 45 Q58 37 66 45 L66 61 Q58 69 50 61Z"],
    thinking: ["M30 28 Q46 20 61 27 L61 53 Q46 62 30 53Z","M30 39 Q47 30 66 34 L64 49 Q47 56 32 49Z"]
  };
  function applyMood() {
    document.getElementById('stage').dataset.mood = mood;
    eyes.forEach(function (eye, i) {
      eye.querySelector('.expression').setAttribute('d', EXPRESSIONS[mood][i]);
      eye.classList.remove('blink');
    });
    document.querySelectorAll('[data-select-mood]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.selectMood === mood));
    });
  }
  document.getElementById('mood-picker').addEventListener('click', function (event) {
    var button = event.target.closest('[data-select-mood]');
    if (!button) return;
    mood = button.dataset.selectMood;
    applyMood();
    showMood();
  });
  applyMood();

  addEventListener("click", function (e) {
    if (!e.target.closest("#camera-controls, #mood-picker")) cycleMood();
  });
  addEventListener("keydown", function (e) {
    if (!e.target.closest("#camera-controls, #mood-picker") && !e.repeat && (e.code === "Space" || e.code === "Enter")) cycleMood();
  });

  /* ================= Blinking ================= */
  function blinkOnce() {
    eyes.forEach(function (e) { e.classList.add("blink"); });
    setTimeout(function () { eyes.forEach(function (e) { e.classList.remove("blink"); }); }, 130);
  }
  function doubleBlink() {
    blinkOnce();
    setTimeout(blinkOnce, 280);
  }
  function wink() {
    var e = eyes[Math.random() < .5 ? 0 : 1];
    e.classList.add("blink");
    setTimeout(function () { e.classList.remove("blink"); }, 500);
  }

  (function blinkLoop() {
    var wait = 2200 + Math.random() * 3500;
    setTimeout(function () {
      if (mood !== "sleepy") {
        if (Math.random() < .18) doubleBlink();
        else if (Math.random() < .12) wink();
        else blinkOnce();
      }
      blinkLoop();
    }, wait);
  })();

  /* ================= Idle behaviors ================= */
  // Occasional glance around (brief auto target override)
  var glance = { active: false, x: 0, y: 0 };
  (function idleLoop() {
    var wait = 3000 + Math.random() * 5000;
    setTimeout(function () {
      var r = Math.random();
      if (r < .5) {
        // glance
        var a = Math.random() * Math.PI * 2;
        glance.active = true;
        glance.x = Math.cos(a) * maxOffset(eyes[0]).x;
        glance.y = Math.sin(a) * maxOffset(eyes[0]).y;
        setTimeout(function () { glance.active = false; }, 700 + Math.random() * 900);
      }
      idleLoop();
    }, wait);
  })();

  /* ================= Pupil follow (smooth) ================= */
  function maxOffset(eye) {
    var r = eye.getBoundingClientRect();
    return { x: r.width * .16, y: r.height * .16 };
  }
  function tick() {
    var tx = 0, ty = 0;
    if (stream && performance.now() - cameraTarget.time < 1800 && performance.now() - lastPointer > 1000) {
      var cameraOffset = maxOffset(eyes[0]);
      tx = (cameraTarget.x * 2 - 1) * cameraOffset.x;
      ty = (cameraTarget.y * 2 - 1) * cameraOffset.y;
    } else if (glance.active) {
      tx = glance.x; ty = glance.y;
    } else {
      var dx = mouse.x - innerWidth / 2;
      var dy = mouse.y - innerHeight / 2;
      var d = Math.hypot(dx, dy) || 1;
      var strength = Math.min(1, d / (innerWidth * .35));
      var m = maxOffset(eyes[0]);
      tx = (dx / d) * m.x * strength;
      ty = (dy / d) * m.y * strength;
    }
    // Let each expression carry its own posture and response speed.
    if (mood === 'sad') { tx *= .65; ty = ty * .5 + 7; }
    if (mood === 'sleepy') { tx *= .4; ty = ty * .3 + 9; }
    if (mood === 'happy') ty -= 4;
    if (mood === 'shy') { tx *= .45; ty = ty * .3 + 10; }
    if (mood === 'thinking') { tx = tx * .25 + 9; ty = ty * .2 - 12; }
    if (mood === 'bored') { tx = tx * .3 - 12; ty *= .2; }
    if (mood === 'suspicious') { tx *= .7; ty *= .3; }
    var ease = ['sleepy', 'bored', 'suspicious'].includes(mood) ? .025 : mood === 'angry' ? .14 : .08;

    // smooth easing
    cur.x += (tx - cur.x) * ease;
    cur.y += (ty - cur.y) * ease;

    pupils.forEach(function (p) {
      p.style.transform = "translate(calc(-50% + " + cur.x.toFixed(1) + "px), calc(-50% + " + cur.y.toFixed(1) + "px))";
    });
    requestAnimationFrame(tick);
  }
  tick();

})();
</script>
