<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EMO Eyes</title>
<style>
  /* ===== Base / fullscreen robot screen ===== */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 6vw;
  }

  /* ===== Eye housing (dark rounded square) ===== */
  .eye {
    position: relative;
    width: min(30vmin, 240px);
    height: min(34vmin, 270px);
    background: radial-gradient(circle at 50% 45%, #10151a 0%, #07090c 60%, #030405 100%);
    border-radius: 45%;
    border: 2px solid #14202a;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,.9),
      0 0 25px rgba(0, 255, 240, .07),
      0 0 60px rgba(0, 255, 240, .04);
    overflow: hidden;
    transition: border-radius .25s ease;
  }

  /* Glowing pupil */
  .pupil {
    position: absolute;
    left: 50%; top: 50%;
    width: 58%; height: 58%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%,
      #b8fff4 0%, #4dfbe4 25%, #0fd8c8 55%, #067f7a 85%, #033a3a 100%);
    box-shadow:
      0 0 18px rgba(0,255,235,.85),
      0 0 45px rgba(0,255,235,.45),
      0 0 90px rgba(0,255,235,.2),
      inset 0 0 20px rgba(255,255,255,.25);
    transition: width .18s ease, height .18s ease, border-radius .2s ease, opacity .2s ease;
    will-change: transform;
  }
  /* specular highlight */
  .pupil::after {
    content: "";
    position: absolute;
    left: 22%; top: 16%;
    width: 26%; height: 20%;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    filter: blur(3px);
  }

  /* Eyelid (closes from top) */
  .lid {
    position: absolute;
    left: -5%; top: -5%;
    width: 110%; height: 0;
    background: #05070a;
    border-radius: 0 0 50% 50% / 0 0 30% 30%;
    z-index: 5;
    transition: height .12s ease;
    box-shadow: 0 4px 12px rgba(0,0,0,.8);
  }
  .eye.blink .lid { height: 105%; }

  /* ===== Scanlines + vignette overlay ===== */
  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 1px,
      transparent 1px, transparent 4px);
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 51;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%);
  }
  /* subtle screen flicker */
  #flicker {
    position: fixed; inset: 0; pointer-events: none; z-index: 52;
    background: rgba(0,255,235,.02);
    animation: flick 6s infinite;
  }
  @keyframes flick {
    0%,100% { opacity: .3; } 48% { opacity: .3; } 50% { opacity: 1; } 52% { opacity: .3; }
  }

  /* ===== UI hints (Persian, RTL) ===== */
  #hints {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    direction: rtl;
    z-index: 60;
    color: rgba(120, 230, 220, .55);
    font-family: Tahoma, "Segoe UI", sans-serif;
    font-size: clamp(12px, 2vmin, 16px);
    letter-spacing: .5px;
    pointer-events: none;
  }
  #hints span { margin: 0 10px; }

  /* Mood label */
  #mood {
    position: fixed;
    top: 24px; left: 0; right: 0;
    text-align: center;
    direction: rtl;
    z-index: 60;
    color: #6ffbe9;
    font-family: Tahoma, "Segoe UI", sans-serif;
    font-size: clamp(18px, 4vmin, 32px);
    text-shadow: 0 0 14px rgba(0,255,235,.8), 0 0 40px rgba(0,255,235,.35);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  #mood.show { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <div class="eye" id="eyeL"><div class="pupil"></div><div class="lid"></div></div>
    <div class="eye" id="eyeR"><div class="pupil"></div><div class="lid"></div></div>
  </div>
  <div id="overlay"></div>
  <div id="vignette"></div>
  <div id="flicker"></div>
  <div id="mood"></div>
  <div id="hints"><span>کلیک/لمس = تغییر حالت</span><span>•</span><span>حرکت = دنبال کردن</span></div>

<script>
(function () {
  "use strict";
  /* ================= State ================= */
  var eyes = [document.getElementById("eyeL"), document.getElementById("eyeR")];
  var pupils = eyes.map(function (e) { return e.querySelector(".pupil"); });
  var moodEl = document.getElementById("mood");

  var mouse = { x: innerWidth / 2, y: innerHeight / 3 };
  var cur = { x: 0, y: 0 };          // current pupil offset (px)
  var mood = "normal";
  var moodTimer = null;

  var MOODS = ["normal", "happy", "sad", "angry", "surprised", "sleepy"];
  var MOOD_FA = {
    normal: "عادی", happy: "خوشحال", sad: "غمگین",
    angry: "عصبانی", surprised: "متعجب", sleepy: "خواب‌آلود"
  };

  /* ================= Pointer tracking ================= */
  function setPointer(x, y) { mouse.x = x; mouse.y = y; }
  addEventListener("mousemove", function (e) { setPointer(e.clientX, e.clientY); });
  addEventListener("touchmove", function (e) {
    if (e.touches.length) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  /* ================= Mood handling ================= */
  function showMood() {
    moodEl.textContent = MOOD_FA[mood];
    moodEl.classList.add("show");
    clearTimeout(moodTimer);
    moodTimer = setTimeout(function () { moodEl.classList.remove("show"); }, 1400);
  }

  function cycleMood() {
    var i = MOODS.indexOf(mood);
    mood = MOODS[(i + 1) % MOODS.length];
    applyMood();
    showMood();
  }

  function applyMood() {
    // Reset shape first
    pupils.forEach(function (p) { p.style.width = ""; p.style.height = ""; p.style.borderRadius = ""; p.style.opacity = ""; });
    eyes.forEach(function (e) { e.style.borderRadius = ""; e.style.transform = ""; });

    switch (mood) {
      case "happy":   // ^ ^ : curved eyes
        eyes.forEach(function (e) { e.style.borderRadius = "50% 50% 8% 8%"; });
        pupils.forEach(function (p) { p.style.height = "26%"; p.style.width = "70%"; p.style.borderRadius = "50% 50% 10% 10%"; });
        break;
      case "sad":     // droopy, small, lowered
        eyes.forEach(function (e, i) {
          e.style.borderRadius = "50%";
          e.style.transform = "rotate(" + (i ? 14 : -14) + "deg)";
        });
        pupils.forEach(function (p) { p.style.width = "42%"; p.style.height = "42%"; p.style.opacity = ".85"; });
        break;
      case "angry":   // slanted lids
        eyes.forEach(function (e, i) {
          e.style.borderRadius = "50% 50% 20% 20%";
          e.style.transform = "rotate(" + (i ? -12 : 12) + "deg)";
        });
        pupils.forEach(function (p) { p.style.width = "50%"; p.style.height = "50%"; });
        break;
      case "surprised": // wide
        eyes.forEach(function (e) { e.style.borderRadius = "50%"; });
        pupils.forEach(function (p) { p.style.width = "72%"; p.style.height = "72%"; });
        break;
      case "sleepy":  // half closed + dim
        eyes.forEach(function (e) { e.style.borderRadius = "40%"; });
        pupils.forEach(function (p) { p.style.opacity = ".4"; });
        eyes.forEach(function (e) { e.querySelector(".lid").style.height = "55%"; });
        break;
      default: break;
    }
  }

  addEventListener("click", cycleMood);
  addEventListener("keydown", cycleMood);
  addEventListener("touchstart", function (e) { cycleMood(); }, { passive: true });

  /* ================= Blinking ================= */
  function blinkOnce() {
    eyes.forEach(function (e) { e.classList.add("blink"); });
    setTimeout(function () { eyes.forEach(function (e) { e.classList.remove("blink"); }); }, 130);
  }
  function doubleBlink() {
    blinkOnce();
    setTimeout(blinkOnce, 280);
  }
  function wink() {
    var e = eyes[Math.random() < .5 ? 0 : 1];
    e.classList.add("blink");
    setTimeout(function () { e.classList.remove("blink"); }, 500);
  }

  (function blinkLoop() {
    var wait = 2200 + Math.random() * 3500;
    setTimeout(function () {
      if (mood !== "sleepy") {
        if (Math.random() < .18) doubleBlink();
        else if (Math.random() < .12) wink();
        else blinkOnce();
      }
      blinkLoop();
    }, wait);
  })();

  /* ================= Idle behaviors ================= */
  // Occasional glance around (brief auto target override)
  var glance = { active: false, x: 0, y: 0 };
  (function idleLoop() {
    var wait = 3000 + Math.random() * 5000;
    setTimeout(function () {
      var r = Math.random();
      if (r < .5) {
        // glance
        var a = Math.random() * Math.PI * 2;
        glance.active = true;
        glance.x = Math.cos(a) * innerWidth * .12;
        glance.y = Math.sin(a) * innerHeight * .1;
        setTimeout(function () { glance.active = false; }, 700 + Math.random() * 900);
      } else if (r < .75) {
        // brief happy squint
        var prev = mood;
        mood = "happy";
        applyMood();
        setTimeout(function () { mood = prev; applyMood(); }, 900 + Math.random() * 800);
      }
      idleLoop();
    }, wait);
  })();

  /* ================= Pupil follow (smooth) ================= */
  function maxOffset(eye) {
    var r = eye.getBoundingClientRect();
    return { x: r.width * .16, y: r.height * .16 };
  }
  function tick() {
    var tx = 0, ty = 0;
    if (glance.active) {
      tx = glance.x; ty = glance.y;
    } else {
      var dx = mouse.x - innerWidth / 2;
      var dy = mouse.y - innerHeight / 2;
      var d = Math.hypot(dx, dy) || 1;
      var strength = Math.min(1, d / (innerWidth * .35));
      var m = maxOffset(eyes[0]);
      tx = (dx / d) * m.x * strength;
      ty = (dy / d) * m.y * strength;
    }
    // sleepy pupils drift downward
    if (mood === "sleepy") ty += 8;

    // smooth easing
    cur.x += (tx - cur.x) * 0.08;
    cur.y += (ty - cur.y) * 0.08;

    pupils.forEach(function (p) {
      p.style.transform = "translate(calc(-50% + " + cur.x.toFixed(1) + "px), calc(-50% + " + cur.y.toFixed(1) + "px))";
    });
    requestAnimationFrame(tick);
  }
  tick();

  // sleepy breathing: slow lid movement
  setInterval(function () {
    if (mood !== "sleepy") return;
    eyes.forEach(function (e) {
      var lid = e.querySelector(".lid");
      lid.style.transition = "height 1.4s ease";
      lid.style.height = (45 + Math.random() * 20) + "%";
      setTimeout(function () { lid.style.height = "55%"; }, 1400);
    });
  }, 3200);
})();
</script>
</body>
</html>
